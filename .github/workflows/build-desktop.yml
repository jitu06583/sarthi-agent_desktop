name: Build Desktop App

# Builds the SARTHI desktop app for Windows, macOS, and Linux, then attaches
# the installers to a GitHub Release.
#
# Trigger it by pushing a version tag, e.g.:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Or run it manually from the Actions tab (workflow_dispatch) to test a build
# without creating a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_script: dist:win
            artifact_glob: apps/desktop/release/*.exe
            name: windows
          - os: macos-latest
            dist_script: dist:mac
            artifact_glob: apps/desktop/release/*.dmg
            name: macos
          - os: ubuntu-latest
            dist_script: dist:linux
            artifact_glob: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/*.rpm
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop workspace dependencies
        run: npm install --workspace apps/desktop

      - name: Build (${{ matrix.name }})
        working-directory: apps/desktop
        run: npm run ${{ matrix.dist_script }}
        env:
          # No Apple Developer credentials configured yet — mac build stays
          # unsigned/un-notarized (users right-click → Open the first time).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarthi-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
