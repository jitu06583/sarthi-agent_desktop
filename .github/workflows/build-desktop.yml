name: Build Desktop App

# Builds the SARTHI desktop app for Windows, macOS, and Linux, then attaches
# the installers to a GitHub Release.
#
# The repo holds no application source. It holds the pinned upstream commit
# and the branding, so every build regenerates the tree from scratch:
#
#   python sync/build.py --out build
#
# That guarantees what ships is exactly what sync/identity.json describes,
# with no drift from a stale checked-in copy.
#
# Trigger by pushing a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Or run manually from the Actions tab to test a build without releasing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_script: dist:win
            artifact_glob: build/apps/desktop/release/*.exe
            name: windows
          - os: macos-latest
            dist_script: dist:mac
            artifact_glob: build/apps/desktop/release/*.dmg
            name: macos
          - os: ubuntu-latest
            dist_script: dist:linux
            artifact_glob: |
              build/apps/desktop/release/*.AppImage
              build/apps/desktop/release/*.deb
              build/apps/desktop/release/*.rpm
            name: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate the branded tree
        run: python sync/build.py --out build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        id: install
        working-directory: build
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$GITHUB_WORKSPACE/step.log"

      - name: Install Linux packaging tools
        if: matrix.name == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm libarchive-tools

      - name: Build (${{ matrix.name }})
        working-directory: build/apps/desktop
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.dist_script }} 2>&1 | tee "$GITHUB_WORKSPACE/step.log"
        env:
          # No Apple Developer credentials configured yet — the mac build stays
          # unsigned/un-notarized (users right-click → Open the first time).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # On failure, publish the tail of the failing command to the run page.
      # Job summaries and annotations are readable without signing in, so a
      # failed build explains itself instead of hiding behind "exit code 1".
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/step.log"
          [ -f "$LOG" ] || { echo "::error::Failed before any captured step ran."; exit 0; }
          {
            echo "### Build failure — ${{ matrix.name }}"
            echo
            echo '```'
            tail -n 120 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          KEY=$(grep -iE "error|not found|mismatch|ENOENT|cannot|failed" "$LOG" | tail -n 12 | tr '\n' ' | ')
          echo "::error::${{ matrix.name }}: ${KEY:-see job summary}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarthi-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
